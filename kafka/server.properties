process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9093
controller.listener.names=CONTROLLER

# CLIENT is for applications and only accepts OAUTHBEARER over TLS.
# BROKER and CONTROLLER carry inter-broker, controller and admin traffic over mTLS.
listeners=CLIENT://:9092,CONTROLLER://:9093,BROKER://:9094
advertised.listeners=CLIENT://kafka:9092,BROKER://kafka:9094
listener.security.protocol.map=CLIENT:SASL_SSL,BROKER:SSL,CONTROLLER:SSL
inter.broker.listener.name=BROKER

ssl.keystore.type=PEM
ssl.keystore.location=/etc/kafka/certs/kafka.pem
ssl.truststore.type=PEM
ssl.truststore.location=/etc/kafka/certs/ca.pem
listener.name.broker.ssl.client.auth=required
listener.name.controller.ssl.client.auth=required
ssl.principal.mapping.rules=RULE:^CN=([a-zA-Z0-9._-]+)$/$1/,DEFAULT

listener.name.client.sasl.enabled.mechanisms=OAUTHBEARER
listener.name.client.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required ;
listener.name.client.oauthbearer.sasl.server.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler
# Name the signature-checking validator explicitly. Kafka 4.1.0 and 4.1.1 fall
# back to a validator that skips the signature check (CVE-2026-33557).
sasl.oauthbearer.jwt.validator.class=org.apache.kafka.common.security.oauthbearer.BrokerJwtValidator
listener.name.client.oauthbearer.sasl.oauthbearer.jwks.endpoint.url=http://openbao:8200/v1/identity/oidc/.well-known/keys
listener.name.client.oauthbearer.sasl.oauthbearer.expected.issuer=http://openbao:8200/v1/identity/oidc
listener.name.client.oauthbearer.sasl.oauthbearer.expected.audience=kafka
listener.name.client.oauthbearer.sasl.oauthbearer.sub.claim.name=kafka_principal

# Make clients re-authenticate at least once a minute. Without this a SASL
# session lives as long as the TCP connection.
connections.max.reauth.ms=60000

authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:kafka;User:kafka-admin

log.dirs=/tmp/kraft-combined-logs
num.partitions=1
auto.create.topics.enable=false
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
